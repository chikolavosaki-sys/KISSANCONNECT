services:
  - type: web
    name: kissan-connect-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        sync: false
      # Creates tables and applies the idempotent SQL migrations at each start.
      - key: RUN_DB_INIT
        value: "true"
      # The included data is suitable for a demo. Set false after importing
      # your own approved states, districts, and schemes.
      - key: SEED_DEMO_DATA
        value: "true"
